[workspace]
resolver = "2"
members = [
  "crates/proto",
  "crates/server",
  "crates/client",
  "crates/dashboard",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.lints.clippy]
pedantic = "warn"
nursery = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1
